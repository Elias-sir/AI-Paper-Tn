<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérifie ta boîte mail - The AI's</title>
  <link rel="icon" type="image/png" href="assents/fonts/theaisfavi.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .confirm-card {
      max-width: 480px;
      padding: 40px 30px;
    }
    .confirm-card .icon {
      font-size: 4rem;
      margin-bottom: 16px;
      display: block;
    }
    .confirm-card h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }
    .confirm-card p {
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
    }
    .confirm-card .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      border-radius: 50px;
      background: linear-gradient(135deg, #6cf2c2, #2ecc71);
      color: #0a0a0f;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }
    .confirm-card .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 24px rgba(46,204,113,0.3);
    }
  </style>
</head>
<body>

<div class="glass-card confirm-card">
  <span class="icon">📬</span>
  <h1>Vérifie ta boîte mail</h1>
  <p>
    Un email de confirmation vient d’être envoyé à <strong id="user-email"></strong>.
    <br><br>
    Clique sur le lien dans l’email pour activer ton compte.
  </p>
  <a href="index.html" class="btn">Retour à l’accueil</a>
</div>

<script>
  // Récupère l'email depuis l'URL
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email');
  if (email) {
    document.getElementById('user-email').textContent = email;
  }
</script>

</body>
</html>
